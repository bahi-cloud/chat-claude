<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BAHI CLOUD — AI COMMAND CENTER</title>
    <style>
        /* ==========================================================
           1. CSS Variables
           ========================================================== */
        :root {
            --bg-base: #03060B;
            --bg-surface: #07101B;
            --bg-surface-glass: rgba(7, 16, 27, 0.8);
            --bg-card-glass: rgba(11, 22, 38, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 229, 255, 0.3);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --accent-cyan: #00E5FF;
            --accent-blue: #4E7CFF;
            --accent-purple: #9A5CFF;
            --accent-green: #42FFB1;
            
            --header-height: 64px;
            --sidebar-width: 320px;
            --font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
            
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ==========================================================
           2. Global & Reset
           ========================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-family);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* App Shell Container */
        .app-shell {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #0a192f 0%, var(--bg-base) 70%);
        }

        /* ==========================================================
           3. Header
           ========================================================== */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--bg-surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .header-right, .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-btn {
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .menu-btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--bg-base);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #FFF 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(66, 255, 177, 0.08);
            border: 1px solid rgba(66, 255, 177, 0.2);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .current-page-indicator {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            display: none;
        }

        @media (min-width: 768px) {
            .current-page-indicator {
                display: block;
            }
        }

        /* ==========================================================
           4. Sidebar & Overlay
           ========================================================== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 6, 11, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .app-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            max-width: 85vw;
            height: 100dvh;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-glass);
            z-index: 200;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .app-sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-glass);
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .close-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .close-sidebar-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 12px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: right;
            width: 100%;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border-color: var(--border-glass);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(78, 124, 255, 0.05));
            border-color: var(--border-glow);
            color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
        }

        .nav-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        /* ==========================================================
           5. Main Workspace & Hero
           ========================================================== */
        .main-workspace {
            position: absolute;
            top: var(--header-height);
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
            scroll-behavior: smooth;
        }

        .view-container {
            display: none;
            width: 100%;
            height: 100%;
        }

        .view-container.active {
            display: flex;
            flex-direction: column;
        }

        /* Home View Content */
        .home-content {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 24px;
            width: 100%;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(154, 92, 255, 0.1);
            border: 1px solid rgba(154, 92, 255, 0.3);
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(154, 92, 255, 0.15);
        }

        .hero-title {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .neon-gradient-text {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
        }

        .hero-description {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            color: var(--text-muted);
            max-width: 650px;
            line-height: 1.6;
        }

        /* ==========================================================
           6. Cards Grid
           ========================================================== */
        .cards-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cards-section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-glass);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .service-card {
            background: var(--bg-card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 24px;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .service-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glow);
            background: rgba(11, 22, 38, 0.85);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 229, 255, 0.1);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .card-icon-wrapper {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
        }

        .card-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-glass);
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border-glass);
        }

        .card-action-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-smooth);
        }

        .service-card:hover .card-action-text {
            gap: 12px;
        }

        /* ==========================================================
           7. Application Iframe View
           ========================================================== */
        .app-iframe-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
        }

        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-base);
        }

        /* ==========================================================
           8. Responsive Media Queries
           ========================================================== */
        @media (max-width: 768px) {
            .app-header {
                padding: 0 16px;
            }
            .home-content {
                padding: 24px 16px;
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .brand-title {
                font-size: 0.95rem;
            }
            .system-status {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <!-- ================= Header ================= -->
        <header class="app-header">
            <div class="header-right">
                <button class="menu-btn" id="menuToggle" aria-label="فتح القائمة">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <a href="#" class="brand-logo" id="homeLinkBtn">
                    <div class="logo-icon">BC</div>
                    <span class="brand-title">BAHI CLOUD</span>
                </a>
            </div>

            <div class="header-left">
                <div class="current-page-indicator" id="pageIndicator">مركز التحكم الرئيسي</div>
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span>SYSTEM ONLINE</span>
                </div>
            </div>
        </header>

        <!-- ================= Sidebar & Overlay ================= -->
        <div class="overlay" id="sidebarOverlay"></div>
        
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">قائمة النظام</span>
                <button class="close-sidebar-btn" id="closeSidebar" aria-label="إغلاق القائمة">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Dynamically populated via JavaScript -->
            </nav>
        </aside>

        <!-- ================= Main Workspace ================= -->
        <main class="main-workspace" id="mainWorkspace">
            
            <!-- Home View -->
            <div class="view-container active" id="homeView">
                <div class="home-content">
                    <section class="hero-section">
                        <div class="hero-badge">
                            <span>✦ NEXT GENERATION AI COMMAND CENTER</span>
                        </div>
                        <h1 class="hero-title">
                            مركز <span class="neon-gradient-text">الذكاء الخارق</span>
                        </h1>
                        <p class="hero-description">
                            منصة موحدة للوصول إلى الوكلاء الذكيين وساحات النقاش والنماذج المتقدمة من واجهة واحدة بأعلى معايير الأداء والأمان لعام 2026.
                        </p>
                    </section>

                    <section class="services-section">
                        <div class="cards-section-title">التطبيقات والخدمات النشطة</div>
                        <div class="cards-grid" id="cardsGrid">
                            <!-- Dynamically populated via JavaScript -->
                        </div>
                    </section>
                </div>
            </div>

            <!-- Application Iframe View -->
            <div class="view-container" id="appView">
                <div class="app-iframe-container">
                    <iframe class="app-iframe" id="serviceIframe" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
                </div>
            </div>

        </main>

    </div>

    <!-- ================= JavaScript Architecture ================= -->
    <script>
        /* ==========================================================
           10. Links Configuration
           ========================================================== */
        // ADD NEW LINKS HERE
        const LINKS = [
            {
                id: "agent",
                name: "الوكيل الخارق",
                description: "الوكيل الذكي المتقدم لتنفيذ المهام المعقدة وتحليل المشاكل.",
                icon: "🤖",
                badge: "AI AGENT",
                url: "https://bahi-cloud.github.io/pro-max-problem/"
            },
            {
                id: "debate",
                name: "ساحة ملتقى الاطباء",
                description: "بيئة تفاعلية لمناقشة وتحليل الأفكار و علاج الامراض بين النماذج المتعددة.",
                icon: "⚡",
                badge: "DEBATE ARENA",
                url: "https://bahi-cloud.github.io/sa7a-ni9ach-pro/"
            },
            {
                id: "models",
                name: "ساحة تحليل المباريات",
                description: "  ساحة تحليل المباريات و توقع النتائج.",
                icon: "◈",
                badge: "تحليل المباريات",
                url: "https://bahi-cloud.github.io/sa7a-football/"
            },
            {
                id: "example1",
                name: " ساحة النقاش  الذكي بين النمادج",
                description: "تحليل الأسواق والعملات والتنبؤ بالاتجاهات المستقبلية.",
                icon: "📈",
                badge: "general",
                url: "https://bahi-cloud.github.io/sa7a-ni9ach/"
            },
            {
                id: "example2",
                name: "أتمتة العمليات",
                description: "ربط سير العمل الذكي وإدارة المهام المبرمجة بالكامل.",
                icon: "⚙️",
                badge: "AUTOMATION",
                url: "https://example.com/"
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const sidebar = document.getElementById("appSidebar");
            const overlay = document.getElementById("sidebarOverlay");
            const menuToggle = document.getElementById("menuToggle");
            const closeSidebarBtn = document.getElementById("closeSidebar");
            const sidebarNav = document.getElementById("sidebarNav");
            const cardsGrid = document.getElementById("cardsGrid");
            const homeView = document.getElementById("homeView");
            const appView = document.getElementById("appView");
            const serviceIframe = document.getElementById("serviceIframe");
            const homeLinkBtn = document.getElementById("homeLinkBtn");
            const pageIndicator = document.getElementById("pageIndicator");
            const mainWorkspace = document.getElementById("mainWorkspace");

            // Render Sidebar Navigation & Cards dynamically
            function renderDynamicContent() {
                // Render Home link in sidebar first
                let sidebarHTML = `
                    <button class="nav-item active" data-id="home">
                        <span class="nav-icon">🏠</span>
                        <span>الرئيسية</span>
                    </button>
                `;

                let cardsHTML = "";

                LINKS.forEach(link => {
                    sidebarHTML += `
                        <button class="nav-item" data-id="${link.id}">
                            <span class="nav-icon">${link.icon}</span>
                            <span>${link.name}</span>
                        </button>
                    `;

                    cardsHTML += `
                        <div class="service-card" data-id="${link.id}">
                            <div class="card-top">
                                <div class="card-icon-wrapper">${link.icon}</div>
                                <span class="card-badge">${link.badge || 'ACTIVE'}</span>
                            </div>
                            <div class="card-body">
                                <h3 class="card-title">${link.name}</h3>
                                <p class="card-desc">${link.description}</p>
                            </div>
                            <div class="card-footer">
                                <span class="card-action-text">
                                    تشغيل الخدمة
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                                </span>
                            </div>
                        </div>
                    `;
                });

                sidebarNav.innerHTML = sidebarHTML;
                cardsGrid.innerHTML = cardsHTML;

                // Attach Event Listeners to generated items
                document.querySelectorAll(".nav-item").forEach(item => {
                    item.addEventListener("click", () => {
                        const id = item.getAttribute("data-id");
                        handleNavigation(id);
                        closeSidebar();
                    });
                });

                document.querySelectorAll(".service-card").forEach(card => {
                    card.addEventListener("click", () => {
                        const id = card.getAttribute("data-id");
                        handleNavigation(id);
                    });
                });
            }

            // Navigation Controller (App Shell Router)
            function handleNavigation(id) {
                // Update Active states in Sidebar
                document.querySelectorAll(".nav-item").forEach(nav => {
                    if (nav.getAttribute("data-id") === id) {
                        nav.classList.add("active");
                    } else {
                        nav.classList.remove("active");
                    }
                });

                if (id === "home") {
                    appView.classList.remove("active");
                    homeView.classList.add("active");
                    serviceIframe.src = "";
                    pageIndicator.textContent = "مركز التحكم الرئيسي";
                    mainWorkspace.scrollTop = 0;
                } else {
                    const targetLink = LINKS.find(l => l.id === id);
                    if (targetLink) {
                        homeView.classList.remove("active");
                        appView.classList.add("active");
                        serviceIframe.src = targetLink.url;
                        pageIndicator.textContent = targetLink.name;
                    }
                }
            }

            // Sidebar Controls
            function openSidebar() {
                sidebar.classList.add("active");
                overlay.classList.add("active");
            }

            function closeSidebar() {
                sidebar.classList.remove("active");
                overlay.classList.remove("active");
            }

            menuToggle.addEventListener("click", openSidebar);
            closeSidebarBtn.addEventListener("click", closeSidebar);
            overlay.addEventListener("click", closeSidebar);

            // ESC Key Handler
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    closeSidebar();
                }
            });

            // Home Branding Click
            homeLinkBtn.addEventListener("click", (e) => {
                e.preventDefault();
                handleNavigation("home");
            });

            // Initialize App
            renderDynamicContent();
        });
    </script>
</body>
</html>
